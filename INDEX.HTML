<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الصرف والعملات</title>
    <link rel="icon" type="image/png" href="./6eb029edb7cfa1197f34276de3b1cbbd.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="p-6 border-b border-slate-800 flex items-center justify-between">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-blue-500"></i> منصة الصرف والعملات
                </h1>
                <p class="text-xs text-slate-400 mt-1">أسعار الصرف اللحظية والمباشرة</p>
            </div>
            <button id="refreshBtn" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all border border-slate-700">
                <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
            </button>
        </div>

        <!-- Form Body -->
        <div class="p-6 space-y-6">

            <!-- Amount Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">المبلغ</label>
                <input type="number" id="amount" value="100" min="1" 
                    class="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 rounded-2xl px-5 py-3.5 text-2xl font-bold text-white focus:outline-none transition-all">
            </div>

            <!-- Currency Selectors -->
            <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 items-center">
                
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">من العملة</label>
                    <select id="fromCurrency" class="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 rounded-2xl p-3.5 text-white font-medium focus:outline-none transition-all">
                        <option value="EUR" selected>🇪🇺 EUR - يورو</option>
                        <option value="USD">🇺🇸 USD - دولار أمريكي</option>
                        <option value="GBP">🇬🇧 GBP - جنيه استرليني</option>
                        <option value="DZD">🇩🇿 DZD - دينار جزائري</option>
                        <option value="SAR">🇸🇦 SAR - ريال سعودي</option>
                        <option value="AED">🇦🇪 AED - درهم إماراتي</option>
                        <option value="CAD">🇨🇦 CAD - دولار كندي</option>
                    </select>
                </div>

                <!-- Swap Button -->
                <div class="flex justify-center sm:pt-6">
                    <button id="swapBtn" class="p-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl shadow-lg shadow-blue-600/20 transition-all active:scale-90">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </button>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">إلى العملة</label>
                    <select id="toCurrency" class="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 rounded-2xl p-3.5 text-white font-medium focus:outline-none transition-all">
                        <option value="DZD" selected>🇩🇿 DZD - دينار جزائري</option>
                        <option value="USD">🇺🇸 USD - دولار أمريكي</option>
                        <option value="EUR">🇪🇺 EUR - يورو</option>
                        <option value="SAR">🇸🇦 SAR - ريال سعودي</option>
                        <option value="AED">🇦🇪 AED - درهم إماراتي</option>
                        <option value="GBP">🇬🇧 GBP - جنيه استرليني</option>
                    </select>
                </div>
            </div>

            <!-- Result Presentation -->
            <div class="p-6 bg-gradient-to-br from-slate-950 to-slate-900 border border-slate-800 rounded-2xl text-center relative">
                <p class="text-xs text-slate-400 font-medium mb-1">المبلغ الإجمالي المكتسب</p>
                <div id="resultOutput" class="text-3xl sm:text-4xl font-extrabold text-blue-400 tracking-tight">--</div>
                <p id="rateDetail" class="text-xs text-slate-500 mt-2">سعر الصرف: --</p>
            </div>

            <!-- Chart -->
            <div class="pt-2">
                <span class="text-xs font-semibold text-slate-400 block mb-3">مؤشر تحرك السعر التقديري</span>
                <div class="h-40 w-full">
                    <canvas id="rateChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Script -->
    <script>
        const API_URL = "https://open.er-api.com/v6/latest/";
        let chartInstance = null;

        const amountInput = document.getElementById('amount');
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const refreshIcon = document.getElementById('refreshIcon');
        const resultOutput = document.getElementById('resultOutput');
        const rateDetail = document.getElementById('rateDetail');

        // Fetch rates and calculation
        async function convertCurrency() {
            const amount = parseFloat(amountInput.value) || 0;
            const from = fromSelect.value;
            const to = toSelect.value;

            if (amount <= 0) {
                resultOutput.textContent = "أدخل مبلغاً صحيحاً";
                return;
            }

            resultOutput.textContent = "جاري التحميل...";
            refreshIcon.classList.add('fa-spin');

            try {
                const res = await fetch(`${API_URL}${from}`);
                const data = await res.json();

                if (data.result === "success") {
                    const rate = data.rates[to];
                    const total = (amount * rate).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    resultOutput.textContent = `${total} ${to}`;
                    rateDetail.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;

                    renderChart(from, to, rate);
                } else {
                    resultOutput.textContent = "خطأ في البيانات";
                }
            } catch (error) {
                resultOutput.textContent = "خطأ الاتصال بالشبكة";
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // Render Trend Chart
        function renderChart(from, to, currentRate) {
            const ctx = document.getElementById('rateChart').getContext('2d');
            const months = ['مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'الآن'];
            const simulatedRates = [
                currentRate * 0.985,
                currentRate * 0.992,
                currentRate * 0.978,
                currentRate * 1.005,
                currentRate * 0.997,
                currentRate
            ];

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: `${from}/${to}`,
                        data: simulatedRates,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.35,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 10 } } },
                        y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 10 } } }
                    }
                }
            });
        }

        // Event Listeners
        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            convertCurrency();
        });

        amountInput.addEventListener('input', convertCurrency);
        fromSelect.addEventListener('change', convertCurrency);
        toSelect.addEventListener('change', convertCurrency);
        refreshBtn.addEventListener('click', convertCurrency);

        // Initial Load
        window.addEventListener('load', convertCurrency);
    </script>
</body>
</html>
